lane_id: netflow
display_name: Netflow
version: "1"
formats: [csv]
unit_of_analysis: flow
entity: {type: ip, field: src_ip}
ip_field: src_ip
time_field: timestamp
label_column: label
behavior:
  on_missing_required: reject_job
  on_missing_optional: fill_default
  on_unknown_columns: ignore
columns:
  required:
    - {name: timestamp, type: datetime}
    - {name: src_ip, type: string}
    - {name: dest_ip, type: string}
    - {name: flow_duration, type: float}
    - {name: dest_port, type: int}
  optional:
    - {name: host_name, type: string, default: "unknown"}
    - {name: user_name, type: string, default: "unknown"}