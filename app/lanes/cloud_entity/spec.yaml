lane_id: cloud_entity
display_name: Cloud Entity logs
version: "1"
formats: [csv, jsonl]
unit_of_analysis: principal_window_15m
entity: {type: principal, field: principal_name}
ip_field: src_ip
time_field: timestamp
label_column: label
behavior:
  on_missing_required: reject_job
  on_missing_optional: fill_default
  on_unknown_columns: ignore
columns:
  required:
    - {name: timestamp, type: datetime}
    - {name: principal_name, type: string}
    - {name: event_id, type: int}
  optional:
    - {name: user_name, type: string, default: "unknown"}
    - {name: src_ip, type: string, default: null, aliases: [ip, source_ip]}