lane_id: netflow
display_name: NetFlow
version: "2.0.0"
formats:
  - csv
  - jsonl

unit_of_analysis: flow

entity:
  type: ip
  field: src_ip

ip_field: src_ip
time_field: timestamp
label_column: label

# Exporters the parser converts automatically (see adapters.py). A file in any
# other layout must already use the canonical column names below.
source_formats: [canonical, cicflowmeter, zeek_conn, netflow_v9, unsw_nb15]

behavior:
  on_missing_required: reject_job
  on_missing_optional: fill_default
  on_unknown_columns: ignore

# Canonical columns. parser.py converts known exporters into these, with
# fixed units: durations in ms, bytes at the IP layer (headers included),
# flag columns > 0 when the flag was seen in the flow.
# Numeric optional columns default to null so a missing counter becomes NaN
# (handled natively by XGBoost) instead of a misleading 0.
# Aliases only rename; they never convert units, so only same-unit names are listed.
columns:
  required:
    - {name: timestamp, type: datetime, aliases: [ts, time, start_time, first_seen, stime]}
    - {name: src_ip, type: string, aliases: [source_ip, srcip, src_addr, sa]}
    - {name: dst_ip, type: string, aliases: [dest_ip, destination_ip, dstip, dst_addr, da]}
    - {name: dst_port, type: int, aliases: [dest_port, destination_port, dport, dp]}
    - {name: flow_duration_ms, type: float, aliases: [duration_ms]}

  optional:
    - {name: label, type: string, default: null}
    - {name: src_port, type: int, default: null, aliases: [source_port, sport, sp]}
    - {name: protocol, type: string, default: "unknown", aliases: [proto, pr]}
    - {name: total_fwd_packets, type: int, default: null, aliases: [fwd_packets]}
    - {name: total_bwd_packets, type: int, default: null, aliases: [bwd_packets]}
    - {name: total_fwd_bytes, type: float, default: null, aliases: [fwd_bytes]}
    - {name: total_bwd_bytes, type: float, default: null, aliases: [bwd_bytes]}
    - {name: tcp_syn_count, type: int, default: null, aliases: [syn_count]}
    - {name: tcp_ack_count, type: int, default: null, aliases: [ack_count]}
    - {name: tcp_rst_count, type: int, default: null, aliases: [rst_count]}
    - {name: tcp_fin_count, type: int, default: null, aliases: [fin_count]}
    - {name: tcp_psh_count, type: int, default: null, aliases: [psh_count]}
